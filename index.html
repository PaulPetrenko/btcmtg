<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Light and dark follow the operating system (prefers-color-scheme). -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#dedede" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e1e20" media="(prefers-color-scheme: dark)" />
    <!-- Project logo (logo/logo btcmtg.svg): the SVG is a byte-identical copy;
         the .ico (32 px) and the Apple touch icon (180 px, on #DEDEDE) are renderings of it. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Self-hosted Inter (SIL OFL 1.1, see /fonts/LICENSE.txt). Fetched early;
         main.tsx waits for it before showing the app. -->
    <link rel="preload" href="/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <title>btcmtg</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
